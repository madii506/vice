<body class="intro">
<canvas id="world" aria-hidden="true"></canvas>
<canvas id="card3d" aria-label="The VICE card. Click it to flip it."></canvas>
<div id="card2d" hidden></div>
<div id="flash" aria-hidden="true"></div>

<main id="home">
  <h1 class="sr">VICE</h1>
  <div class="ctas">
    <button id="enter" class="cta"><span>Enter world</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="homeConnect" class="ghost"><span class="dot"></span><span class="lbl">Connect wallet</span></button>
  </div>
</main>

<div id="app" hidden>
  <header class="tb">
    <button class="brand" id="leave" aria-label="Back to the street"><span class="chrome">VICE</span></button>
    <nav id="tabs" aria-label="Sections">
      <button data-sec="wash">Wash</button><button data-sec="term">Terminal</button><button data-sec="statement">Statement</button><button data-sec="card">Card</button><button data-sec="wanted">Wanted</button><button data-sec="ttwo">$TTWO</button><button data-sec="receipts">Receipts</button><button data-sec="faq">FAQ</button>
    </nav>
    <div class="tb-r">
      <span class="pill" id="tbGta"><span class="k">GTA VI</span><b id="tbGtaT">—</b></span>
      <a id="xlink" class="ico" hidden target="_blank" rel="noopener" aria-label="VICE on X"></a>
      <button id="wbtn" class="btn-connect"><span class="dot"></span><span class="lbl">Connect</span></button>
    </div>
  </header>
  <div class="grid">
    <aside class="col acct" id="acct"></aside>
    <section class="col pane" id="pane" aria-live="polite"></section>
    <aside class="col live" id="live"></aside>
  </div>
  <div id="tape" aria-hidden="true"><div class="tape-in" id="tapeIn"></div></div>
</div>

<div id="modal" hidden><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="mhead"><h3 id="mTitle">Connect wallet</h3><button class="ib" id="mClose" aria-label="Close"></button></div><div id="mBody"></div></div></div>

<div id="passed" aria-live="polite" hidden>
  <div class="mp">
    <div class="mp-t" id="mpT">Mission passed</div>
    <div class="mp-a" id="mpA"></div>
    <div class="mp-s" id="mpS"></div>
    <div class="mp-b"><button class="cta sm" id="mpCard">Make your card</button><button class="ghost sm" id="mpClose">Keep washing</button></div>
  </div>
  <div class="mp-rain" id="mpRain"></div>
</div>

<div id="toasts" aria-live="polite"></div>
<noscript><p class="nojs">VICE needs JavaScript to wash your bags.</p></noscript>
<script type="module" src="/main.js?v=3"></script>
</body>
</html>
